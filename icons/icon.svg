<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Ambient glow circle -->
  <circle cx="256" cy="240" r="140" fill="#f59e0b" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- Shield Base -->
  <path d="M 256,76 L 396,134 C 396,260 336,364 256,420 C 176,364 116,260 116,134 Z"
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>

  <!-- Diamond Facets Inside Shield -->
  <!-- Upper table facet -->
  <polygon points="210,170 302,170 346,216 166,216" fill="url(#goldGrad)" opacity="0.95"/>
  <!-- Center facet -->
  <polygon points="166,216 346,216 256,334" fill="url(#cyanGrad)" opacity="0.85"/>
  <!-- Left facet -->
  <polygon points="166,216 256,334 190,260" fill="#38bdf8" opacity="0.6"/>
  <!-- Right facet -->
  <polygon points="346,216 256,334 322,260" fill="#0284c7" opacity="0.6"/>
  <!-- Top reflections -->
  <polygon points="210,170 256,216 302,170" fill="#ffffff" opacity="0.65"/>
  <polygon points="210,170 166,216 195,216" fill="#fef08a" opacity="0.5"/>
  <polygon points="302,170 346,216 317,216" fill="#f59e0b" opacity="0.5"/>

  <!-- Sparkle stars -->
  <path d="M 374,150 Q 374,166 390,166 Q 374,166 374,182 Q 374,166 358,166 Q 374,166 374,150 Z" fill="#fef08a"/>
  <path d="M 140,290 Q 140,302 152,302 Q 140,302 140,314 Q 140,302 128,302 Q 140,302 140,290 Z" fill="#38bdf8"/>
  <path d="M 360,320 Q 360,328 368,328 Q 360,328 360,336 Q 360,328 352,328 Q 360,328 360,320 Z" fill="#fef08a"/>
</svg>
